name: CI / Release

# Push e PR rodam o job `test` e param por aí. Só uma tag `v*` libera os jobs
# de build e a publicação — cada um deles guardado por `if:` além do gatilho,
# para que um `workflow_dispatch` a partir de um branch não publique nada.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Nothing gets built, and nothing reaches PyPI, until this passes. Publishing
  # to PyPI is irreversible: a bad wheel cannot be replaced, only yanked.
  test:
    name: Test (Rust + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --no-default-features drops extension-module, which tells the linker to
      # leave libpython symbols undefined. That is correct for the wheel but
      # produces a test binary that cannot link on Linux.
      - name: Rust unit tests
        env:
          PYO3_PYTHON: python
        run: cargo test --no-default-features --lib

      - name: Build, install the extension and run the Python tests
        # `pip install` drives the maturin build backend, so it compiles the
        # Rust extension and installs it (plus the dev extras) into the
        # runner's Python — no virtualenv needed, unlike `maturin develop`,
        # which aborts when it cannot find one.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest

  linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        env:
          # `ring` (puxado por `rustls`, via `reqwest`) falha ao cross-compilar
          # sua assembly pregenerada para aarch64 dentro do container manylinux
          # do maturin-action: o cross-gcc não define `__ARM_ARCH` por padrão
          # nesse ambiente, e o preprocessor de `ring` exige essa macro
          # (erro: "ARM assembler must define __ARM_ARCH"). Forçar a macro via
          # CFLAGS é o workaround padrão para esse problema conhecido — não
          # afeta o build x86_64 (a env var é específica do target aarch64).
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, linux, musllinux, windows, macos, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: python -m pip install --upgrade maturin requests

      # A sanity check before anything leaves the runner: publishing an
      # incomplete set is worse than not publishing, because PyPI never lets a
      # filename be reused — a half-uploaded version can only be completed,
      # never replaced.
      - name: Verify the artifact set is complete
        run: |
          set -euo pipefail
          ls -la dist/
          test -n "$(find dist -name '*.tar.gz' -print -quit)" \
            || { echo "::error::sdist ausente — abortando antes de publicar"; exit 1; }
          wheels=$(find dist -name '*.whl' | wc -l)
          echo "wheels: $wheels"
          test "$wheels" -ge 7 \
            || { echo "::error::só $wheels wheels; esperado >= 7 (2 linux, 2 musl, 1 win, 2 macos)"; exit 1; }

      # PyPI returns a transient 500 often enough to matter, and the upload is
      # file-by-file: a failure halfway leaves the version published in part.
      # --skip-existing makes the retry idempotent (already-uploaded files are
      # skipped by name), so a second attempt finishes the job instead of
      # failing on the files that did make it.
      - name: Publish to PyPI (with retry)
        uses: nick-fields/retry@v3
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          timeout_minutes: 15
          max_attempts: 4
          retry_wait_seconds: 45
          command: maturin upload --non-interactive --skip-existing dist/*

      # Proves the release is actually complete, rather than trusting an exit
      # code that a partial upload can still produce.
      - name: Verify every file reached PyPI
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, glob, time, requests
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # Só .whl e .tar.gz: são os únicos tipos de arquivo que o PyPI hospeda.
          # `pypa/gh-action-pypi-publish` deixa um .publish.attestation por
          # distribuição em dist/ depois de publicar (atestados PEP 740, que
          # sobem junto do arquivo, não como arquivo próprio). Um glob amplo os
          # conta como "faltando no PyPI" e reprova uma release que deu certo.
          local = {
              os.path.basename(p)
              for pattern in ("dist/*.whl", "dist/*.tar.gz")
              for p in glob.glob(pattern)
          }
          url = f"https://pypi.org/pypi/rust-py-audit/{version}/json"
          for attempt in range(6):          # PyPI's JSON API is cached
              response = requests.get(url, timeout=30)
              if response.status_code == 200:
                  remote = {f["filename"] for f in response.json()["urls"]}
                  missing = local - remote
                  if not missing:
                      print(f"OK: {len(remote)} arquivos publicados na {version}")
                      sys.exit(0)
              else:
                  missing = local
              print(f"tentativa {attempt + 1}: faltam {len(missing)}")
              time.sleep(20)
          print("::error::faltaram arquivos no PyPI:")
          for name in sorted(missing):
              print(f"  - {name}")
          sys.exit(1)
          PY
