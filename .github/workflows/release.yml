name: CI / Release

# Push e PR rodam `lint` + `test` e param por aí. Os jobs de build são
# liberados por uma tag `v*` ou por um `workflow_dispatch` manual — o segundo
# existe para o ensaio no TestPyPI, abaixo.
#
# **Só a tag publica no PyPI de produção.** O job `release` é o único guardado
# apenas por `startsWith(github.ref, 'refs/tags/')`, sem a cláusula de
# dispatch: um disparo manual constrói tudo e vai para o TestPyPI, nunca para
# o índice de verdade. Publicação no PyPI não se desfaz, então essa assimetria
# é proposital.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # O lint faz parte do portão de release, não de um workflow paralelo.
  # Nos repositórios de workflow único, um `lint` vermelho ao lado de uma
  # publicação bem-sucedida seria ruído difícil de ler — a leitura passa a ser
  # inequívoca: vermelho significa que não publicou.
  #
  # A toolchain é fixa, não "stable": com `-D warnings`, um clippy mais novo
  # no runner reprova código que ninguém tocou, e a CI ficaria vermelha por
  # conta do calendário. Subir este número vira uma mudança deliberada.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # clippy só checa tipos, não linka, então --all-features é seguro aqui
      # (diferente do `cargo test`, que precisa de --no-default-features).
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Nothing gets built, and nothing reaches PyPI, until this passes. Publishing
  # to PyPI is irreversible: a bad wheel cannot be replaced, only yanked.
  test:
    name: Test (Rust + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --no-default-features drops extension-module, which tells the linker to
      # leave libpython symbols undefined. That is correct for the wheel but
      # produces a test binary that cannot link on Linux.
      - name: Rust unit tests
        env:
          PYO3_PYTHON: python
        run: cargo test --no-default-features --lib

      - name: Build, install the extension and run the Python tests
        # `pip install` drives the maturin build backend, so it compiles the
        # Rust extension and installs it (plus the dev extras) into the
        # runner's Python — no virtualenv needed, unlike `maturin develop`,
        # which aborts when it cannot find one.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest

  linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        env:
          # `ring` (puxado por `rustls`, via `reqwest`) falha ao cross-compilar
          # sua assembly pregenerada para aarch64 dentro do container manylinux
          # do maturin-action: o cross-gcc não define `__ARM_ARCH` por padrão
          # nesse ambiente, e o preprocessor de `ring` exige essa macro
          # (erro: "ARM assembler must define __ARM_ARCH"). Forçar a macro via
          # CFLAGS é o workaround padrão para esse problema conhecido — não
          # afeta o build x86_64 (a env var é específica do target aarch64).
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    # Um job só, os dois targets: o runner `macos-latest` é ARM e compila o
    # x86_64 de forma cruzada. Antes era uma matriz de dois jobs, e cada
    # release precisava de DUAS máquinas macOS — a fila mais disputada do
    # GitHub Actions. Em 20/10/2026 dois releases (monitor 0.5.0, audit 0.4.1)
    # ficaram parados com "The job was not acquired by Runner of type hosted
    # even after multiple attempts" à espera da segunda.
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels (x86_64)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
      - name: Build wheels (aarch64)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  sdist:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Ensaio da troca OIDC, sem tocar no índice de produção. É o que permite
  # descobrir um publisher mal cadastrado num lugar onde nada é irreversível —
  # no PyPI, um nome de arquivo publicado nunca pode ser reusado.
  #
  # ⚠️ Precisa do seu próprio publisher, cadastrado no TestPyPI (que é uma
  # conta separada do PyPI), com owner/repo, workflow `release.yml` e
  # environment `testpypi`.
  #
  # Não há verificação pós-upload aqui de propósito: o que se está validando é
  # a troca de token, e o TestPyPI expira distribuições — reprovar por um
  # arquivo que o índice de teste descartou seria alarme falso.
  publish-testpypi:
    name: Publish to TestPyPI (ensaio)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, test, linux, musllinux, windows, macos, sdist]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, linux, musllinux, windows, macos, sdist]

    # Trusted publishing (OIDC). Não existe mais `secrets.PYPI_API_TOKEN` aqui:
    # o GitHub emite um JWT curto afirmando repositório, workflow e ref, e o
    # PyPI o troca por um token de upload válido por poucos minutos e só para
    # este projeto. Some o segredo de longa duração que, se vazasse, publicaria
    # até alguém revogá-lo à mão.
    #
    # ⚠️ Os três valores abaixo precisam bater EXATAMENTE com o publisher
    # cadastrado em PyPI → Manage → Publishing:
    #   owner/repo .... robertolima-dev/rust-py-audit
    #   workflow ...... release.yml   (o nome deste arquivo)
    #   environment ... pypi
    # Divergência em qualquer um deles é rejeitada na troca do token.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `requests` é só para a verificação pós-upload, mais abaixo. A maturin
      # não é mais instalada aqui: quem publica agora é a action oficial do
      # PyPA, que é a que sabe fazer a troca OIDC.
      - name: Install the verification dependency
        run: python -m pip install --upgrade requests

      # A sanity check before anything leaves the runner: publishing an
      # incomplete set is worse than not publishing, because PyPI never lets a
      # filename be reused — a half-uploaded version can only be completed,
      # never replaced.
      - name: Verify the artifact set is complete
        run: |
          set -euo pipefail
          ls -la dist/
          test -n "$(find dist -name '*.tar.gz' -print -quit)" \
            || { echo "::error::sdist ausente — abortando antes de publicar"; exit 1; }
          wheels=$(find dist -name '*.whl' | wc -l)
          echo "wheels: $wheels"
          test "$wheels" -ge 7 \
            || { echo "::error::só $wheels wheels; esperado >= 7 (2 linux, 2 musl, 1 win, 2 macos)"; exit 1; }

      # O PyPI devolve 500 transitório com frequência suficiente para importar,
      # e o upload é arquivo por arquivo: uma falha no meio deixa a versão
      # publicada pela metade. `skip-existing` é o que torna a segunda
      # tentativa segura — sem ele, ela morre nos arquivos que já subiram.
      #
      # São dois passos explícitos em vez de um wrapper de retry porque o
      # trusted publishing exige a action oficial, e ela não dá para acionar
      # por linha de comando de dentro do `nick-fields/retry`. Mesma forma que
      # o `rust_py_cache` e o `rust_py_rate_limit` já rodam.
      - name: Publish to PyPI (attempt 1)
        id: publish1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Wait before retrying
        if: steps.publish1.outcome == 'failure'
        run: sleep 45

      - name: Publish to PyPI (attempt 2)
        if: steps.publish1.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      # Proves the release is actually complete, rather than trusting an exit
      # code that a partial upload can still produce.
      - name: Verify every file reached PyPI
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, glob, time, requests
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # Só .whl e .tar.gz: são os únicos tipos de arquivo que o PyPI hospeda.
          # `pypa/gh-action-pypi-publish` deixa um .publish.attestation por
          # distribuição em dist/ depois de publicar (atestados PEP 740, que
          # sobem junto do arquivo, não como arquivo próprio). Um glob amplo os
          # conta como "faltando no PyPI" e reprova uma release que deu certo.
          #
          # ⚠️ Isto deixou de ser precaução e passou a valer aqui: com trusted
          # publishing a action gera os atestados, coisa que o `maturin upload`
          # não fazia. O recorte veio do alarme falso da rate_limit 0.2.1
          # (P1-9) e é o que impede esta migração de reprovar o primeiro
          # release por um motivo inventado.
          local = {
              os.path.basename(p)
              for pattern in ("dist/*.whl", "dist/*.tar.gz")
              for p in glob.glob(pattern)
          }
          url = f"https://pypi.org/pypi/rust-py-audit/{version}/json"
          for attempt in range(6):          # PyPI's JSON API is cached
              response = requests.get(url, timeout=30)
              if response.status_code == 200:
                  remote = {f["filename"] for f in response.json()["urls"]}
                  missing = local - remote
                  if not missing:
                      print(f"OK: {len(remote)} arquivos publicados na {version}")
                      sys.exit(0)
              else:
                  missing = local
              print(f"tentativa {attempt + 1}: faltam {len(missing)}")
              time.sleep(20)
          print("::error::faltaram arquivos no PyPI:")
          for name in sorted(missing):
              print(f"  - {name}")
          sys.exit(1)
          PY
